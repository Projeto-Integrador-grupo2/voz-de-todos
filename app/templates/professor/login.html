{% extends "base.html" %}

{% block content %}
<div class="card">
    <h3>Login Professor</h3>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Usuário">
        <input type="password" name="password" placeholder="Senha">
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
