{% extends "base.html" %}

{% block content %}
<div class="card">
    <h3>Meu Perfil</h3>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="nome" value="{{ professor.nome }}">
        <input type="email" name="email" value="{{ professor.email }}">
        <button type="submit">Salvar</button>
    </form>
</div>
{% endblock %}
